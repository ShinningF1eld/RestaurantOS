name: CI

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: M6 / ${{ matrix.gate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - baseline
          - backend-static
          - frontend-static
          - backend-unit
          - backend-integration
          - frontend-tests
          - frontend-build
          - migrations
          - browser
          - image
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos # pragma: allowlist secret
          POSTGRES_DB: restaurantos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantos -d restaurantos_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://restaurantos:restaurantos@127.0.0.1:5432/restaurantos_test # pragma: allowlist secret
      TEST_REDIS_HOST: 127.0.0.1
      TEST_REDIS_PORT: "6379"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install committed locks
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          npm ci --prefix frontend
      - name: Install Chromium
        if: matrix.gate == 'browser'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run shared gate
        run: python scripts/validate.py --gate ${{ matrix.gate }} --external-services --no-install
      - name: Retain coverage and safe failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-${{ matrix.gate }}
          path: |
            backend/coverage/**
            frontend/coverage/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    name: Milestone 6 acceptance
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: test "$QUALITY_RESULT" = success
