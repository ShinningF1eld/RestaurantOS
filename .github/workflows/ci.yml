name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-baseline:
    name: Repository baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install secret scanner
        run: python -m pip install detect-secrets==1.5.0
      - name: Check Docker Compose configuration
        run: docker compose config --quiet
      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  backend:
    name: Backend — Python 3.12 and clean PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: restaurantos
          POSTGRES_PASSWORD: restaurantos # pragma: allowlist secret
          POSTGRES_DB: restaurantos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restaurantos -d restaurantos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://restaurantos:restaurantos@localhost:5432/restaurantos # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Check dependency integrity
        run: python -m pip check
      - name: Lint backend
        run: python -m ruff check app tests
      - name: Type-check typed schema scope
        run: python -m mypy app/schemas
      - name: Run backend tests
        run: python -m pytest
      - name: Upgrade a clean database to Alembic head
        run: python -m alembic upgrade head
      - name: Verify Alembic metadata matches models
        run: python -m alembic check

  frontend:
    name: Frontend — Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Type-check frontend
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
