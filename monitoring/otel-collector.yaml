# Foundation accepts the declared synthetic service only. Application telemetry
# needs its own reviewed source policy in #59; a service name is not authentication.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 65536
        include_metadata: false
        read_header_timeout: 3s
        read_timeout: 3s
        write_timeout: 3s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 32

  filter/synthetic:
    error_mode: propagate
    trace_conditions:
      - context: resource
        conditions:
          - 'resource.attributes["service.name"] != "restaurantos-monitoring-synthetic"'
      - context: span
        conditions:
          - 'span.name != "synthetic.operation" and span.name != "synthetic.child"'
          - 'Len(span.links) > 0'
      - context: spanevent
        conditions: ['true']
    metric_conditions:
      - context: resource
        conditions:
          - 'resource.attributes["service.name"] != "restaurantos-monitoring-synthetic"'
      - context: metric
        conditions:
          - 'metric.name != "restaurantos.synthetic.operations" and metric.name != "restaurantos.synthetic.duration" and metric.name != "restaurantos.synthetic.last_observation"'
      - context: datapoint
        conditions:
          - 'Len(datapoint.exemplars) > 0'
    log_conditions:
      - context: resource
        conditions:
          - 'resource.attributes["service.name"] != "restaurantos-monitoring-synthetic"'

  transform/synthetic:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(scope.attributes, [])
      - set(scope.name, "restaurantos.monitoring.synthetic")
      - set(scope.version, "1")
      - keep_keys(span.attributes, [])
      - set(span.status.message, "")
      - set(span.trace_state, "")
    metric_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(scope.attributes, [])
      - set(scope.name, "restaurantos.monitoring.synthetic")
      - set(scope.version, "1")
      - set(metric.description, "")
      - set(metric.unit, "1") where metric.name == "restaurantos.synthetic.operations"
      - set(metric.unit, "s") where metric.name != "restaurantos.synthetic.operations"
      - keep_keys(datapoint.attributes, [])
      - set(datapoint.attributes["operation"], "synthetic.operation")
      - set(datapoint.attributes["outcome"], "success")
    log_statements:
      - keep_keys(resource.attributes, ["service.name"])
      - keep_keys(scope.attributes, [])
      - set(scope.name, "restaurantos.monitoring.synthetic")
      - set(scope.version, "1")
      - keep_keys(log.attributes, [])
      - set(log.body, "synthetic operation completed")
      - set(log.severity_text, "INFO")
      - set(log.severity_number, SEVERITY_NUMBER_INFO)

  batch:
    timeout: 1s
    send_batch_size: 64
    send_batch_max_size: 128
    # No client metadata partitions or per-tenant buffers.
    metadata_keys: []

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 30s
    send_timestamps: false
    enable_open_metrics: true
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_constant_labels:
      included: [service.name]

  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    timeout: 2s
    compression: none
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 4194304
      num_consumers: 2
      wait_for_result: false
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s

  otlp_http/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    compression: none
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 4194304
      num_consumers: 2
      wait_for_result: false
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 2s
      max_elapsed_time: 10s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
      encoding: json
      disable_caller: true
      disable_stacktrace: true
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, transform/synthetic, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, transform/synthetic, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/synthetic, transform/synthetic, batch]
      exporters: [otlp_http/tempo]
