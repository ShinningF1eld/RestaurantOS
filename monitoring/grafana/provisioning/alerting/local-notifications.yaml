apiVersion: 1

# Only the disposable exercise starts this internal endpoint. No SMTP or remote
# webhook is configured by RestaurantOS.
contactPoints:
  - orgId: 1
    name: RestaurantOS local receiver
    receivers:
      - uid: restaurantos-local-capture
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://alert-receiver:8080/alerts

policies:
  - orgId: 1
    receiver: RestaurantOS local receiver
    group_by: [alertname, role, worker_slot, consumer, source]
    group_wait: 5s
    group_interval: 15s
    repeat_interval: 30m
