apiVersion: 1

groups:
  - orgId: 1
    name: RestaurantOS local incidents
    folder: RestaurantOS
    interval: 15s
    rules:
      - uid: ros-local-api
        title: Sustained API errors
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels: {scope: restaurantos-local}
        annotations:
          summary: Sustained API errors
          runbook_url: https://github.com/ShinningF1eld/RestaurantOS/blob/main/docs/runbooks/local-incidents.md#api-errors
        data:
          - refId: A
            datasourceUid: restaurantos-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              datasource: {type: prometheus, uid: restaurantos-prometheus}
              expr: |
                ros_alert:qualified{signal="api"} * 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1.5]}
                  unloadEvaluator: {type: lt, params: [0.5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: ros-local-pool
        title: Database pool saturation
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels: {scope: restaurantos-local}
        annotations:
          summary: Database pool saturation
          runbook_url: https://github.com/ShinningF1eld/RestaurantOS/blob/main/docs/runbooks/local-incidents.md#database-exhaustion
        data:
          - refId: A
            datasourceUid: restaurantos-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              datasource: {type: prometheus, uid: restaurantos-prometheus}
              expr: |
                ros_alert:qualified{signal="pool"} * 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1.5]}
                  unloadEvaluator: {type: lt, params: [0.5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: ros-local-backlog
        title: Old unfinished work
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels: {scope: restaurantos-local}
        annotations:
          summary: Old unfinished work
          runbook_url: https://github.com/ShinningF1eld/RestaurantOS/blob/main/docs/runbooks/local-incidents.md#queue-backlog
        data:
          - refId: A
            datasourceUid: restaurantos-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              datasource: {type: prometheus, uid: restaurantos-prometheus}
              expr: |
                ros_alert:qualified{signal="backlog"} * 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1.5]}
                  unloadEvaluator: {type: lt, params: [0.5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: ros-local-jobs
        title: Repeated job failures
        condition: B
        for: 0s
        noDataState: KeepLast
        execErrState: KeepLast
        labels: {scope: restaurantos-local}
        annotations:
          summary: Repeated job failures
          runbook_url: https://github.com/ShinningF1eld/RestaurantOS/blob/main/docs/runbooks/local-incidents.md#repeated-job-failure
        data:
          - refId: A
            datasourceUid: restaurantos-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              datasource: {type: prometheus, uid: restaurantos-prometheus}
              expr: |
                ros_alert:qualified{signal="jobs"} * 1
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [1.5]}
                  unloadEvaluator: {type: lt, params: [0.5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
      - uid: ros-local-telemetry
        title: Missing operational telemetry
        condition: B
        for: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels: {scope: restaurantos-local}
        annotations:
          summary: Missing operational telemetry
          runbook_url: https://github.com/ShinningF1eld/RestaurantOS/blob/main/docs/runbooks/local-incidents.md#monitoring-outage
        data:
          - refId: A
            datasourceUid: restaurantos-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              instant: true
              range: false
              datasource: {type: prometheus, uid: restaurantos-prometheus}
              expr: |
                label_replace(((vector(1) unless ros_alert:api_fresh) or vector(0)), "source", "api", "", ".*")
                or label_replace(((vector(1) unless ros_alert:delivery_fresh) or vector(0)), "source", "delivery_sampler", "", ".*")
                or label_replace(((vector(1) unless ros_alert:worker_fresh) or vector(0)), "source", "worker", "", ".*")
                or label_replace(((vector(1) unless (max(up{job="collector-telemetry"}) == 1)) or vector(0)), "source", "collector", "", ".*")
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator: {type: gt, params: [0.5]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
