# Single-process local trace store, with no Kafka/cache/generator dependencies.
multitenancy_enabled: false
usage_report:
  reporting_enabled: false
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 5s
  max_block_duration: 5m
  max_block_bytes: 10485760
  flush_check_period: 5s
  flush_all_on_shutdown: true
compactor:
  compaction:
    block_retention: 72h
    compacted_block_retention: 10m
    compaction_cycle: 5m
    retention_concurrency: 1
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    blocklist_poll: 30s
querier:
  max_concurrent_queries: 2
query_frontend:
  search:
    concurrent_jobs: 2
overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
    global:
      max_bytes_per_trace: 262144
