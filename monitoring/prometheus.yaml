global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 15s

# Retention is configured by Compose's --storage.tsdb.retention.time=7d.
# No application target, remote-write endpoint or speculative alert rules yet.
scrape_configs:
  - job_name: collector-telemetry
    static_configs:
      - targets: [collector:8889]
    sample_limit: 1000
    label_limit: 16
    label_name_length_limit: 128
    label_value_length_limit: 256
  - job_name: collector-self
    static_configs:
      - targets: [collector:8888]
    sample_limit: 5000
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
    sample_limit: 5000
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
    sample_limit: 10000
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
    sample_limit: 10000
