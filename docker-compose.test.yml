# Disposable validation infrastructure. Always use a unique --project-name.
# No developer volume, fixed container name, or fixed host port is shared.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: restaurantos
      POSTGRES_PASSWORD: restaurantos # pragma: allowlist secret
      POSTGRES_DB: restaurantos_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurantos -d restaurantos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
