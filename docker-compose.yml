services:
  postgres:
    image: postgres:16
    container_name: restaurantos-postgres
    restart: unless-stopped
    # Local-development defaults only. Do not reuse these credentials in a
    # shared, staging, or production environment.
    environment:
      POSTGRES_USER: restaurantos
      POSTGRES_PASSWORD: restaurantos # pragma: allowlist secret
      POSTGRES_DB: restaurantos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurantos -d restaurantos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
