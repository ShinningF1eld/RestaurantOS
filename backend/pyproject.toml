[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "app.schemas.*"
disallow_untyped_defs = true
