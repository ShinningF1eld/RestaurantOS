[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
relative_files = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.http.*",
    "app.modules.*",
]
disallow_untyped_defs = true
